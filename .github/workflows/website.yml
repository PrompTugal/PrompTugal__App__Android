name: website

# The Android site (website/, built by website/build.py) on GitHub Pages at android.app.promptugal.ai.
# Skipped cleanly until website/build.py exists and until Pages is set to deploy from GitHub Actions
# (docs/ci.md says what Dinis does). Third-party actions are pinned by full commit SHA, tag in the comment:
# actions/checkout v4.2.2, actions/upload-pages-artifact v4.0.0, actions/deploy-pages v4.0.5.

on:
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  # A finished android run (a new release on the releases page): rebuild so the site shows it. A release
  # made with the built-in GITHUB_TOKEN does not trigger a `release` event, a workflow_run does.
  workflow_run:
    workflows: [android]
    types: [completed]
    branches: [dev]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a running deploy is never cancelled.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (test, build, validate)
    # After an android run only when that run succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read   # to see whether Pages is set to deploy from GitHub Actions
    outputs:
      has_site: ${{ steps.detect.outputs.has_site }}
      deploy: ${{ steps.detect.outputs.deploy }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      # A run caused by an android run or a release builds the latest dev (the site shows the releases);
      # pushes, pull requests and manual runs build what triggered them.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'release') && 'dev' || '' }}

      - name: Is there a site, and is Pages ready
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ENABLED_VAR: ${{ vars.PAGES_ENABLED }}
        run: |
          has_site=false; [ -f website/build.py ] && has_site=true
          # Pages counts as ready when its source is GitHub Actions (build_type workflow), or when the
          # repository variable PAGES_ENABLED is "true" (an override if the API cannot be read).
          ready=false
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)" = workflow ]; then ready=true; fi
          [ "$PAGES_ENABLED_VAR" = true ] && ready=true
          deploy=false
          if [ "$has_site" = true ] && [ "$ready" = true ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then deploy=true; fi
          echo "has_site=$has_site" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "## website (run ${{ github.run_number }})"
            echo "- website/build.py present: $has_site"
            echo "- Pages set to deploy from GitHub Actions: $ready"
            echo "- will deploy: $deploy"
            if [ "$has_site" != true ]; then echo "- skipped: website/build.py does not exist yet"
            elif [ "$ready" != true ]; then echo "- built and validated only: Pages is not enabled with source GitHub Actions (docs/ci.md)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        if: steps.detect.outputs.has_site == 'true'
        run: |
          if [ -f website/test_site.py ]; then python3 -m unittest website/test_site.py
          else echo "no website/test_site.py yet" >> "$GITHUB_STEP_SUMMARY"; fi

      # build.py writes the site to website/_site/ (index.html at its root). GH_TOKEN (read-only,
      # contents: read) and GITHUB_REPOSITORY are there if it lists the releases through the API.
      - name: Build
        if: steps.detect.outputs.has_site == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 website/build.py
          test -f website/_site/index.html || { echo "website/build.py did not write website/_site/index.html" >&2; exit 1; }

      - name: Validate
        if: steps.detect.outputs.has_site == 'true'
        run: |
          if [ -f website/validate.py ]; then python3 website/validate.py
          else echo "no website/validate.py yet" >> "$GITHUB_STEP_SUMMARY"; fi

      # The custom domain lives in the artifact (no CNAME file is needed in the repository), and the
      # build marker is how the deploy job proves the live site is this build.
      - name: Add CNAME and the build marker
        if: steps.detect.outputs.deploy == 'true'
        run: |
          printf 'android.app.promptugal.ai\n' > website/_site/CNAME
          printf '{"sha":"%s","run":%s}\n' "$(git rev-parse HEAD)" "${{ github.run_number }}" > website/_site/build.json

      - name: Upload the site
        if: steps.detect.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/_site

  deploy:
    name: deploy (GitHub Pages)
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pages: write and id-token: write only here, on the job that deploys.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify:
    name: verify (the live site serves this build)
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for build.json on the live site to carry the built commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          WANT: ${{ needs.build.outputs.sha }}
        run: |
          want="$WANT"
          # Pages can take a minute to serve a new deployment; the custom domain needs DNS and a certificate.
          for i in $(seq 1 24); do
            got=$(curl -fsSL --max-time 15 "${PAGE_URL}build.json?run=$i" 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])' 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              echo "OK: $PAGE_URL serves build $want" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 10
          done
          echo "FAILED: $PAGE_URL does not serve build $want after 4 minutes (served: ${got:-nothing})" | tee -a "$GITHUB_STEP_SUMMARY" >&2
          echo "If the custom domain is new, check DNS (CNAME android.app to promptugal.github.io) and Settings, Pages." >&2
          exit 1
