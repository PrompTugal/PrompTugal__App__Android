name: android

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      play_track:
        description: Google Play track for the upload (needs the Play secrets and the upload key)
        type: choice
        options: [internal, alpha]
        default: internal

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # CI owns the version: never set by hand (see docs/ci.md).
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

# Third-party actions are pinned by full commit SHA, the tag is in the comment.
# actions/checkout v4.2.2, actions/setup-java v4.7.1, gradle/actions v4.4.4,
# actions/upload-artifact v4.6.2, actions/cache v4.2.3, r0adkll/upload-google-play v1.1.3.
jobs:
  check:
    name: check (tests and lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Cache Robolectric's Android runtime (about 150 MB, fetched by the tests)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts', 'app/src/test/resources/robolectric.properties') }}

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## check (run ${{ github.run_number }})"
            echo "- version under test: ${VERSION_NAME} (code ${VERSION_CODE})"
            echo "- unit tests and lint: ${{ job.status }}"
            echo "- reports: artifact reports-${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release (build, sign, distribute)
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The GitHub Environment `release` holds the release secrets and can require a reviewer (docs/ci.md).
    environment: release
    permissions:
      contents: write   # to create the GitHub release
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' && secrets.UPLOAD_KEYSTORE_PASSWORD != '' && secrets.UPLOAD_KEY_ALIAS != '' && secrets.UPLOAD_KEY_PASSWORD != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' && secrets.FIREBASE_APP_ID != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track || 'internal' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Decode the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Release APK and AAB
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Name the outputs and read the application ID
        id: out
        run: |
          mkdir -p out
          suffix=$([ "$HAS_UPLOAD_KEY" = true ] && echo "" || echo "-unsigned")
          cp app/build/outputs/apk/release/*.apk "out/riskmandate-$VERSION_NAME$suffix.apk"
          cp app/build/outputs/bundle/release/*.aab "out/riskmandate-$VERSION_NAME$suffix.aab"
          # The application ID is provisional: read it from the built APK, never hardcode it.
          aapt2=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | sort -V | tail -1)
          app_id=$("$aapt2" dump badging "out/riskmandate-$VERSION_NAME$suffix.apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [ -z "$app_id" ]; then echo "could not read the application ID" >&2; exit 1; fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riskmandate-${{ env.VERSION_NAME }}
          path: out/
          if-no-files-found: error

      - name: Firebase App Distribution (testers group "team")
        id: firebase
        if: github.event_name == 'push' && env.HAS_UPLOAD_KEY == 'true' && env.HAS_FIREBASE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          umask 077
          # firebase-tools comes from .github/firebase/package-lock.json (integrity hashes), no install scripts.
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/firebase
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/fad.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fad.json"
          .github/firebase/node_modules/.bin/firebase appdistribution:distribute "out/riskmandate-$VERSION_NAME.apk" \
            --app "$FIREBASE_APP_ID" --groups team \
            --release-notes "RiskMandate $VERSION_NAME from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

      - name: Write the Play service account
        if: env.HAS_PLAY == 'true' && env.HAS_UPLOAD_KEY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          chmod 600 "$RUNNER_TEMP/play.json"

      # status: draft keeps it safe: the release is created on the track but not rolled out
      # until a person completes it in the Play Console.
      - name: Google Play (draft release on the chosen track)
        id: play
        if: env.HAS_PLAY == 'true' && env.HAS_UPLOAD_KEY == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: ${{ steps.out.outputs.app_id }}
          releaseFiles: out/riskmandate-${{ env.VERSION_NAME }}.aab
          track: ${{ env.PLAY_TRACK }}
          status: draft
          releaseName: ${{ env.VERSION_NAME }}

      - name: GitHub release with the APK
        id: ghrelease
        if: github.event_name == 'push' && env.HAS_UPLOAD_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "out/riskmandate-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "RiskMandate $VERSION_NAME" \
            --notes "Built from ${GITHUB_SHA::7} on dev. Signed with the upload key."

      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json" "$RUNNER_TEMP/fad.json"

      - name: Summary
        if: always()
        env:
          APP_ID: ${{ steps.out.outputs.app_id }}
          FIREBASE_OUTCOME: ${{ steps.firebase.outcome }}
          PLAY_OUTCOME: ${{ steps.play.outcome }}
          GH_OUTCOME: ${{ steps.ghrelease.outcome }}
          EVENT: ${{ github.event_name }}
        run: |
          reason() { # $1 outcome, $2 secrets-present flag(s), $3 push-only
            case "$1" in
              success) echo "ran" ;;
              failure) echo "FAILED" ;;
              cancelled) echo "cancelled" ;;
              *) if [ "$HAS_UPLOAD_KEY" != true ]; then echo "skipped: upload key secrets missing"
                 elif [ "$2" != true ]; then echo "skipped: $3 missing"
                 elif [ "$4" = push ] && [ "$EVENT" != push ]; then echo "skipped: only on push"
                 else echo "skipped"; fi ;;
            esac
          }
          {
            echo "## release (run ${{ github.run_number }})"
            echo "- version: ${VERSION_NAME} (versionCode ${VERSION_CODE}), application ID: ${APP_ID:-unknown} (provisional)"
            echo "- signing: $([ "$HAS_UPLOAD_KEY" = true ] && echo 'signed with the upload key' || echo 'UNSIGNED: UPLOAD_KEYSTORE_* and UPLOAD_KEY_* secrets missing')"
            echo "- Firebase App Distribution: $(reason "$FIREBASE_OUTCOME" "$HAS_FIREBASE" 'FIREBASE_SERVICE_ACCOUNT_JSON or FIREBASE_APP_ID secret' push)"
            echo "- Google Play (${PLAY_TRACK}, draft): $(reason "$PLAY_OUTCOME" "$HAS_PLAY" 'PLAY_SERVICE_ACCOUNT_JSON secret' any)"
            echo "- GitHub release: $(reason "$GH_OUTCOME" true '' push)"
            echo "- artifact: riskmandate-${VERSION_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
