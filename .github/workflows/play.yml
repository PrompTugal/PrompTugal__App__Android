name: play

# Google Play, from main only. It does NOT rebuild: it takes the signed AAB that the dev run built for the
# commit now on main (from that commit's GitHub release), checks its SHA-256, and uploads it as a DRAFT on
# the internal track. A person completes the release in the Play Console. Runs from main's copy of this file
# (a push to main), so a change on dev cannot touch it. Third-party actions pinned by SHA:
# actions/checkout v4.2.2, r0adkll/upload-google-play v1.1.3.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to upload, 7 to 40 hex digits (a person's decision; uses the human-promotion variant of the check)
        required: true
      base:
        description: The main commit the approval was made against (the main before that commit was promoted), 7 to 40 hex digits
        required: true

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  play:
    name: play (draft on the internal track)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The GitHub Environment `play` holds PLAY_SERVICE_ACCOUNT_JSON (Dinis; deployment branches main only).
    environment: play
    defaults:
      run:
        shell: bash   # -eo pipefail: a failing verifier before `| tee` must fail the step
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # tags and history: the release is found by tag

      # Defence in depth: main moves only by promote.yml (a signed, approved commit) or by Dinis. Re-run
      # security.android's check (docs/security/approvals.md) with main's own copy of the verifier: the keys and
      # approvals are those on the main BEFORE this push, the tip is the commit now on main. A push (automatic)
      # must pass the normal check, which also refuses a commit that changes a trust path (workflows, keys, the
      # verifier, CLAUDE.md): that one is uploaded only when a PERSON dispatches this workflow with the commit and
      # the base, which uses the human-promotion variant. Fails closed on any non-zero exit.
      - name: Which commit, and is it approved
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUSHED: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          if [ "$EVENT" = push ]; then base=$BEFORE; sha=$PUSHED; verifier=scripts/verify-approval.mjs
          else
            base=$INPUT_BASE; sha=$INPUT_SHA; verifier=scripts/verify-approval-human.mjs
            # A person types these: 7 to 40 hex digits, each resolved to exactly one full commit by object name
            # (scripts/resolve-commit.sh: refs are ignored, so a branch or tag named like the digits cannot
            # redirect them; ambiguous or unknown values are refused). The verifier gets full 40-digit SHAs.
            base=$(bash scripts/resolve-commit.sh "$INPUT_BASE") || { echo "the base input is not one commit: $INPUT_BASE" >&2; exit 1; }
            sha=$(bash scripts/resolve-commit.sh "$INPUT_SHA") || { echo "the sha input is not one commit: $INPUT_SHA" >&2; exit 1; }
            echo "- dispatch inputs resolved by object name: sha ${INPUT_SHA} -> ${sha}, base ${INPUT_BASE} -> ${base}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]] || { echo "no usable base (the main before this push): refusing" >&2; exit 1; }
          sha=$(git rev-parse "$sha^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not on main: refusing" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "## play (run ${{ github.run_number }}): ${sha:0:12}, approval checked against main ${base:0:12} with $verifier" >> "$GITHUB_STEP_SUMMARY"
          node "$verifier" --repo . --main "$base" --tip "$sha" | tee -a "$GITHUB_STEP_SUMMARY" || {
            {
              echo "- not uploaded: the signed approval check did not pass for this commit (the reason is in the line above)."
              echo "- Expected for the bootstrap merge and for any commit that changes a trust path (.github/, board/keys.json, the verifier, CLAUDE.md): a person promotes those, so nothing is uploaded automatically."
              echo "- A person who decides to upload this commit anyway: Actions, play, Run workflow, from main, with sha=${sha} and base=${base} (the human-promotion variant of the check; it still needs a valid signed PASS made against that base)."
            } | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Find the dev build of this commit
        id: rel
        run: |
          tag=$(bash scripts/find-release-tag.sh "${{ steps.sha.outputs.sha }}") || { echo "- no GitHub release of a dev build matches this commit: nothing to upload (play.yml never rebuilds)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "- build: GitHub release $tag" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the signed AAB and check its SHA-256
        id: aab
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.aab' --pattern '*.apk' --pattern SHA256SUMS
          [ "$(ls *.aab | wc -l)" = 1 ] || { echo "expected exactly one .aab in release $TAG" >&2; exit 1; }
          case "$(ls *.aab)" in *-unsigned.aab) echo "the release carries an unsigned AAB: refusing" >&2; exit 1;; esac
          sha256sum --check --strict SHA256SUMS
          aab=$(ls "$PWD"/*.aab); apk=$(ls "$PWD"/*.apk)
          # Provenance, not just a checksum: SHA256SUMS sits in the same release as the AAB and only catches
          # corruption. The attestation proves this repository's android.yml built these exact files from the
          # commit the release tag points at (a signed statement made at build time, outside the release).
          built=$(git rev-parse "$TAG^{commit}")
          for f in "$aab" "$apk"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/android.yml" --source-digest "$built" \
              --source-ref refs/heads/dev --deny-self-hosted-runners
          done
          aapt2=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | sort -V | tail -1)
          app_id=$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          [ -n "$app_id" ] || { echo "could not read the application ID" >&2; exit 1; }
          echo "aab=$aab" >> "$GITHUB_OUTPUT"; echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "- $(basename "$aab") matches SHA256SUMS ($(sha256sum "$aab" | cut -c1-16)...) and its build attestation (built by android.yml from ${built:0:12}), application ID $app_id" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the Play service account
        if: env.HAS_PLAY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"

      # status: draft: the release is created on the track, not rolled out, until a person completes it
      # in the Play Console. The version code is the dev run number inside the AAB: it only goes up.
      - name: Google Play (draft on internal)
        id: play
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: ${{ steps.aab.outputs.app_id }}
          releaseFiles: ${{ steps.aab.outputs.aab }}
          track: internal
          status: draft
          releaseName: ${{ steps.rel.outputs.tag }}

      - name: Remove the key and summarise
        if: always()
        env:
          OUTCOME: ${{ steps.play.outcome }}
        run: |
          rm -f "$RUNNER_TEMP/play.json"
          case "$OUTCOME" in
            success) echo "- uploaded as a DRAFT on the internal track: a person completes it in the Play Console" ;;
            failure) echo "- Google Play upload FAILED" ;;
            *) [ "$HAS_PLAY" = true ] && echo "- not uploaded (an earlier step failed)" || echo "- not uploaded: PLAY_SERVICE_ACCOUNT_JSON is not set in the environment play (checks above passed)" ;;
          esac >> "$GITHUB_STEP_SUMMARY"
