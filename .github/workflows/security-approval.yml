name: security-approval

# Is the head of a pull request to main approved by security.android (signed PASS, docs/security/approvals.md)?
# pull_request_target: GitHub runs THIS file from the pull request's BASE branch (main), not from the PR's merge
# commit, so a pull request cannot edit or skip its own check (security's R-rel-1; a `pull_request` job would run the
# PR's own copy of the workflow). It therefore also starts only once this file is on main. The check out is the
# base commit; the head is fetched as DATA and only ever read by git inside the verifier: nothing from the head
# is checked out, built or executed. No secrets, read-only token. Fails closed on any non-zero exit.
# Third-party action pinned by SHA: actions/checkout v4.2.2.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  security-approval:
    name: security-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash   # -eo pipefail: a failing verifier before `| tee` must fail the step
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}   # the base: main's own verifier and keys
          fetch-depth: 0
          persist-credentials: false

      - name: Approval of the pull request head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f scripts/verify-approval.mjs ] || { echo "main has no scripts/verify-approval.mjs yet: the first release flow reaches main by Dinis's pull request (docs/ci.md), so this check fails until then" | tee -a "$GITHUB_STEP_SUMMARY" >&2; exit 1; }
          # The head as data only (a fork's commits too): fetched, never checked out.
          git fetch -q origin "refs/pull/${PR}/head"
          [ "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA" ] || { echo "the fetched head is not the event's head sha: refusing" >&2; exit 1; }
          node scripts/verify-approval.mjs --repo . --main "$BASE_SHA" --tip "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
